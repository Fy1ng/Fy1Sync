  <title id="title">对齐是怎么做到的</title>
  <desc id="desc">两路直播经过画面匹配 (比对相同视角的画面特征, 不限游戏, 支持双路可视化框选有效区域与标注忽略遮罩), 算出时间差, 把较快的一路延后, 复核通过后显示已对齐.</desc>
