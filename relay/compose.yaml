services:
  relay:
    container_name: fy1sync-schedule-relay
    image: fy1sync-schedule-relay:${RELAY_TAG:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5081:5081'
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: '5081'
      RELAY_DATA_DIR: /data
    volumes:
      - relay-data:/data
    mem_limit: 384m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
volumes:
  relay-data:
